[project]
name = "robotics_toolbox"
version = "0.1.0"
description = "Robotics toolbox used to teach basic robotics at CTU."
authors = [
    { name = "Vladimir Petrik", email = "vladimir.petrik@cvut.cz" },
]
requires-python = ">=3.10,<3.13"
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.14.1",
    "matplotlib>=3.9.2",
    "shapely>=2.0.6",
    "opencv-python>=4.10.0.84",
    "yourdfpy>=0.0.56",
    "trimesh>=4.4.9",
    "pycollada>=0.8",
    "python-fcl>=0.7.0.6",
    "viser>=1.0.0",
    "robot_descriptions>=3.0.0",
    "imageio>=2.35.1",
]

[dependency-groups]
test = [
    "pytest>=7.4.3",
]
lint = [
    "black>=23.10.1",
    "ruff>=0.1.3",
]
doc = [
    "sphinx",
    "sphinx-rtd-theme>=2.0.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "doc" },
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.black]
target-version = ["py310"]
