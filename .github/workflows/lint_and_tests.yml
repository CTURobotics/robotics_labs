name: lint_and_tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests exercises
      - run: uv run black --check --diff src tests exercises
      - run: uv run pytest tests/test_geometry_utils.py
      # all tests can be collected without the implementation, they fail on asserts only
      - run: uv run pytest --collect-only -q tests/
#      - run: uv run pytest tests/ # runs all the tests, but it is necessary to finish
#        # the implementation of template for it to work
